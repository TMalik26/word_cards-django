name: Ping the App

on:
  schedule:
    - cron: "*/10 8-17 * * 1-5"
      timezone: "Europe/Kyiv"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Wait for app to become healthy
        run: |
          URL="https://word-cards-3yra.onrender.com"
          echo "Waiting up to 5 minutes for $URL to respond..."
          TIMEOUT=300        # total seconds to wait
          INTERVAL=5         # seconds between attempts
          elapsed=0
          until curl -fsS --max-time 10 "$URL" >/dev/null 2>&1; do
            elapsed=$((elapsed + INTERVAL))
            if [ "$elapsed" -ge "$TIMEOUT" ]; then
              echo "Timed out after ${elapsed}s waiting for $URL"
              exit 1
            fi
            echo "Still waiting: ${elapsed}/${TIMEOUT}s"
            sleep $INTERVAL
          done
          echo "$URL is up"
